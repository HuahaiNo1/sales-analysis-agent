[project]
name = "sales-analysis-agent"
version = "0.1.0"
description = "A guarded DeepAgents sales BI assistant on SQLBI Contoso simulated data"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "deepagents==0.7.22", "langchain-openai>=1.0,<2",
  "httpx[socks]>=0.28,<1", "python-dotenv>=1.0,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
